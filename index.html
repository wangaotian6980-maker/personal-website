<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <!-- Tailwind CSS (样式库) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (核心引擎) -->

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion (动画库) -->

    <!-- Babel (让浏览器直接理解 JSX 的编译器) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 加载屏幕动画 */
        #loading-screen {
            position: fixed; inset: 0; background: #eef2f6; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #1a2356; border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; scroll-behavior: smooth;}
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="color: #1a2356; font-weight: bold; font-size: 1.2rem;">正在加载页面...</h2>
    </div>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // 1. 从全局变量中提取需要的核心功能
        const { useState, useEffect, forwardRef } = React;
        
        // --- 容错处理：获取 Framer Motion 变量 ---
        const FMLib = window.Motion || window.FramerMotion || window.framerMotion;
        let motion, AnimatePresence;

        if (FMLib) {
            motion = FMLib.motion;
            AnimatePresence = FMLib.AnimatePresence;
        } else {
            console.warn("Framer Motion 加载失败或变量不匹配，已启用降级模式 (无动画)");
            // 降级占位，防止 React 报错导致白屏
            const filterProps = (props) => {
                const { initial, animate, exit, whileHover, whileTap, whileInView, viewport, transition, layoutId, ...rest } = props;
                return rest;
            };
            motion = {
                div: forwardRef((props, ref) => <div ref={ref} {...filterProps(props)} />),
                button: forwardRef((props, ref) => <button ref={ref} {...filterProps(props)} />),
                main: forwardRef((props, ref) => <main ref={ref} {...filterProps(props)} />)
            };
            AnimatePresence = ({children}) => <>{children}</>;
        }

        // 2. 内置 SVG 图标 (彻底解决 lucide-react 加载报错问题)
        const Icon = ({ size=24, className="", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Briefcase = (p) => <Icon {...p}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></Icon>;
        const ChevronRight = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
        const Globe = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>;
        const ShieldCheck = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></Icon>;
        const TrendingUp = (p) => <Icon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
        const CheckCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
        const Mail = (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
        const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
        const TerminalSquare = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/></Icon>;
        const Network = (p) => <Icon {...p}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></Icon>;

        const BarChart = (p) => <Icon {...p}><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></Icon>;

        const theme = {
        primary: '#1a2356',
        accent: '#0088ff',
        yellow: '#f5b225',
        bg: '#eef2f6',
        surface: '#ffffff'
        };

        // 打字机组件
        const Typewriter = ({ texts }) => {
        const [currentText, setCurrentText] = useState('');
        const [currentIndex, setCurrentIndex] = useState(0);
        const [isDeleting, setIsDeleting] = useState(false);
        const [blink, setBlink] = useState(true);

        useEffect(() => {
            const blinkInterval = setInterval(() => setBlink(b => !b), 500);
            return () => clearInterval(blinkInterval);
        }, []);

        useEffect(() => {
            const text = texts[currentIndex];
            
            let timer;
            if (isDeleting) {
            if (currentText === '') {
                setIsDeleting(false);
                setCurrentIndex((prev) => (prev + 1) % texts.length);
            } else {
                timer = setTimeout(() => {
                setCurrentText(currentText.slice(0, -1));
                }, 75);
            }
            } else {
            if (currentText === text) {
                timer = setTimeout(() => setIsDeleting(true), 2000);
            } else {
                timer = setTimeout(() => {
                setCurrentText(text.slice(0, currentText.length + 1));
                }, 150);
            }
            }
            
            return () => clearTimeout(timer);
        }, [currentText, isDeleting, currentIndex, texts]);

        return (
            <span className="inline-flex items-center">
            <span className="bg-[#1a2356] text-white px-4 py-1 leading-snug md:leading-normal">{currentText}</span>
            <span className={`inline-block w-1 h-12 md:h-14 bg-white ml-1 ${blink ? 'opacity-100' : 'opacity-0'}`} />
            </span>
        );
        };

            challenges: ['代理权剥离困难：老经销商虽无经营动作但拒绝释放代理权，面临复杂的谈判与解约流程。',"品牌力持续滑坡：两年的市场空窗期导致品牌声量微弱，消费者与终端商产生信任危机。","终端渠道被蚕食：竞品在此期间完成了深度的网点置换，市场进入壁垒提高"],

            results: ['市场重启： 成功清退无效代理商，引入实力新商，实现当月铺货率提升 200%。']

        {
            id: 'p2',
            title: '山东济南凯之岳企业配合',

            challenges: ['时效性与集成链路的冲突。从生产、质检到物流安装的各环节高度紧补，且全自动产线涉及多模块联调，任何一个环节的微小偏差都将导致展会演示失败。', '现场复杂环境下的感知精度限制。展馆光线环境复杂（强光、阴影、反光铝材），且人员流动频繁，传统导航易失效，对自动化转运设备的避障与定位精度要求极高。',"跨系统异构接口的协议适配。实现转运系统与机床加工系统的“手眼协同”，需解决不同品牌/型号控制器之间的通讯延迟与逻辑握手问题。"],

            results: ['现场实现“料入-工完-成品出”的全闭环无人化演示，展示效率较人工模式提升 40%。','证了模块化交付流程，为后续该一体化方案的快速商用落地提供实战参考。']
            }
        }
        ];

        // 履历详情视图
        const ExperienceDetailView = ({ expId, onBack }) => {
        const exp = experienceData.find(e => e.id === expId);
        if (!exp) return null;

        return (
            <motion.div
            initial={{ opacity: 0, y: 20 }}

            exit={{ opacity: 0, y: -20 }}
            className="max-w-4xl mx-auto px-6 pt-32 pb-20"
            >
            <button 
                onClick={onBack}
                className="flex items-center gap-2 text-[#1a2356] font-bold mb-12 hover:-translate-x-2 transition-transform"
            >
                <ChevronRight size={20} className="rotate-180" /> 返回主页
            </button>

            <div className="bg-white border-4 border-[#1a2356] rounded-[40px] shadow-[12px_12px_0_rgba(26,35,86,1)] overflow-hidden">

        // 项目详情视图
        const ProjectDetailView = ({ projectId, onBack }) => {

                    </svg>
                    <ArrowUp size={24} className="text-[#1a2356] group-hover:text-blue-500 transition-colors z-10" />
                </motion.button>
                )}
            </AnimatePresence>
            </div>
        );
        }

        // ------------------ 渲染控制 ------------------
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // 代码执行完毕后，淡出并移除加载动画
        const loader = document.getElementById('loading-screen');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }
    </script>
</body>
</html>
